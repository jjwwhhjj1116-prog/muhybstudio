name: validate-workflow

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Validate repository
        run: python -B automation/validate_repository.py
      - name: Test initialization and multi-PC synchronization
        run: python -B -m unittest discover -s tests -v
      - name: Check whitespace
        run: git diff --check
